[book]
title = "faio 使用文档"
authors = ["faio contributors"]
description = "faio C++23 异步 I/O 库：快速开始、认识 faio、API 介绍与 API 查询。"
language = "zh-CN"
src = "../../docs"

[build]
build-dir = "../../target/site/book"
extra-watch-dirs = ["../../examples", "../../include", "theme"]

[preprocessor.repository-links]
command = "python3 ../../.github/site/scripts/docs_links.py"
after = ["links"]

[output.html]
theme = "mdbook-theme"
default-theme = "light"
preferred-dark-theme = "light"
smart-punctuation = true
git-repository-url = "https://github.com/superlxh02/faio"
edit-url-template = "https://github.com/superlxh02/faio/edit/main/docs/{path}"
additional-css = ["theme/book.css"]
additional-js = ["node_modules/mermaid/dist/mermaid.min.js", "theme/book.js"]
no-section-label = true

[output.html.search]
enable = true
limit-results = 24

[output.html.fold]
enable = true
level = 1

[output.html.playground]
runnable = false
